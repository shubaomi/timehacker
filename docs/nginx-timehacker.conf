map $http_upgrade $timehacker_connection_upgrade {
    default upgrade;
    "" close;
}

upstream timehacker_app {
    server 127.0.0.1:3008;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name timehacker.hihongrun.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name timehacker.hihongrun.com;

    ssl_certificate /etc/nginx/ssl/hihongrun-zerossl-fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/hihongrun-zerossl.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    access_log /var/log/nginx/timehacker.access.log;
    error_log /var/log/nginx/timehacker.error.log;

    client_max_body_size 1m;

    location / {
        proxy_pass http://timehacker_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $timehacker_connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        add_header X-Accel-Buffering "no";
    }
}
